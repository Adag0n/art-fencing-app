name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36
        pip install kivy

    - name: Initialize and Configure Buildozer
      run: |
        buildozer init
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy==2.3.0,requests,urllib3,idna,certifi,charset-normalizer/g' buildozer.spec
        sed -i 's/#android.permissions =/android.permissions = INTERNET/g' buildozer.spec
        sed -i 's/android.api = 31/android.api = 33/g' buildozer.spec
        sed -i 's/#android.ndk = 25b/android.ndk = 25b/g' buildozer.spec
        sed -i 's/android.archs = arm64-v8a armeabi-v7a/android.archs = arm64-v8a/g' buildozer.spec

    - name: Build with Buildozer (Safe Actions Mode)
      run: |
        # Две строчки ниже принудительно отключают блокировку прав Linux в GitHub Actions
        export BUILDOZER_ALLOW_KIVY_BUILD_FROM_ROOT=1
        export _BUILDOZER_ALLOW_ROOT=1
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArtFencing-APK
        path: bin/*.apk
