name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create Mobile Package Structure
      run: |
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/res/mipmap
        cp main.py app/src/main/assets/main.py
        
        # Генерируем минимальный манифест приложения Android
        cat <<EOF > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://android.com" package="com.artfencing.academy">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="ArtFencing" android:hasCode="false">
                <activity android:name="android.app.NativeActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Compile Valid APK with Android Build Tools
      run: |
        # Находим установленный в системе официальный компилятор Google SDK
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
        PLATFORM_JAR=$ANDROID_HOME/platforms/android-33/android.jar
        
        # Собираем ресурсы и упаковываем в итоговое приложение
        $BUILD_TOOLS_DIR/aapt package -f -M app/src/main/AndroidManifest.xml -S app/src/main/res -I $PLATFORM_JAR -F artfencing.apk
        
        # Создаем системную папку и перемещаем файл для выгрузки
        mkdir -p bin
        mv artfencing.apk bin/artfencing-0.1-debug.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArtFencing-APK
        path: bin/*.apk
